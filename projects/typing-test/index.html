<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Test and improve your typing speed and accuracy with EclipsesDev's free online typing test. Track WPM, accuracy, and compete against yourself.">
      <title>Typing Test</title>
      <link rel="canonical" href="https://eclipsesdev.top/projects/typing-test">

      <!-- Open Graph / Facebook -->
      <meta property="og:type" content="website">
      <meta property="og:site_name" content="EclipsesDev">
      <meta property="og:title" content="Eclipse Typing Test">
      <meta property="og:description" content="Test and improve your typing speed and accuracy with EclipsesDev's free online typing test. Track WPM, accuracy, and compete against yourself.">
      <meta property="og:url" content="https://eclipsesdev.top/projects/typing-test">
      <meta property="og:image" content="/assets/img/favicon.ico">

      <!-- Twitter -->
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:site" content="@EclipsesDev">
      <meta name="twitter:title" content="Eclipse Typing Test">
      <meta name="twitter:description" content="Test and improve your typing speed and accuracy with EclipsesDev's free online typing test. Track WPM, accuracy, and compete against yourself.">
      <meta name="twitter:image" content="/assets/img/favicon.ico">

      <link rel="icon" href="/assets/img/favicon.ico" type="image/x-icon">
      <link rel="stylesheet" href="/assets/style.css">
      <link rel="stylesheet" href="/assets/typing-test/app.css">
  </head>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Typing Test",
    "url": "https://eclipsesdev.top/projects/typing-test",
    "description": "Test and improve your typing speed and accuracy. Track WPM, accuracy, and compete against yourself.",
    "applicationCategory": "UtilityApplication"
  }
  </script>
  <body>
    <div class="container">

      <!-- Nav Bar -->
      <nav class="nav-bar">
        <a href="/projects/panel"><button>Back</button></a>
        <a href="/" class="nav-link"><button>Home</button></a>
      </nav>

      <!-- Typing Test Section -->
      <div class="typetest">
        <div class="section">
          <div class="title">Typing Speed Test</div>

          <div id="difficulty-buttons">
            <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
          </div>

          <div class="stats">
            <span>Time: <b id="time">60</b>s</span>
            <span>WPM: <b id="wpm">0</b></span>
            <span>Accuracy: <b id="accuracy">100</b>%</span>
          </div>

          <div id="text-display" class="text-display"></div>

          <input type="text" id="input-field" autocomplete="off" placeholder="Start typing here..." />

          <button id="restart">Restart</button>

        </div>
      </div>

    </div>

    <!-- Script Section -->
    <script src="/assets/typing-test/app.js"></script>
  </body>
</html>
